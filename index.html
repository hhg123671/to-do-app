<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do List | قائمة المهام</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. متغيرات الألوان والثيمات (Color Themes)
           ========================================== */
        :root {
            /* Theme Default: Violet */
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.35);

            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --card-bg: #334155;
            --card-border: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* الثيم الأزرق - Ocean */
        [data-theme="ocean"] {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.35);
        }

        /* الثيم الأخضر - Emerald */
        [data-theme="emerald"] {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.35);
        }

        /* الثيم الوردي - Rose */
        [data-theme="rose"] {
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --primary-glow: rgba(244, 63, 94, 0.35);
        }

        /* الوضع الفاتح - Light Mode */
        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            transition: var(--transition);
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ==========================================
           2. شريط التحكم الأعلى والقائمة التفاعلية
           ========================================== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn, .palette-btn {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle-btn:hover, .palette-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        /* قائمة اختيار الألوان */
        .color-palette-menu {
            display: none;
            position: absolute;
            top: 60px;
            right: 1rem;
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            padding: 0.8rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            gap: 10px;
            z-index: 100;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .color-palette-menu.show {
            display: flex;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .color-dot.active {
            border-color: var(--text-main);
            transform: scale(1.15);
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            cursor: pointer;
            display: inline-block;
            transition: var(--transition);
            animation: float 4s ease-in-out infinite;
        }

        .main-title:hover {
            transform: scale(1.03);
        }

        .author-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Actions Bar */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .create-btn {
            background: var(--primary);
            color: #fff;
            padding: 0.8rem 1.6rem;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .create-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 22px var(--primary-glow);
        }

        .create-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .stats-badge {
            background: var(--surface-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-badge span {
            color: var(--primary);
            font-weight: 700;
        }

        /* ==========================================
           3. التنسيقات والأعمدة (Board & Columns)
           ========================================== */
        .board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .column {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            min-height: 450px;
            transition: var(--transition);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--card-border);
        }

        .column-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ==========================================
           4. تصميم كارت المهمة وتأثيرات الأنيميشن
           ========================================== */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            transition: var(--transition);
            animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px -5px var(--primary-glow);
        }

        .card-body {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .card-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            margin-top: 2px;
            transition: transform 0.2s ease;
        }

        .card-checkbox:hover {
            transform: scale(1.15);
        }

        .card-text {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text-main);
            word-break: break-word;
            transition: var(--transition);
        }

        .completed .card-text {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            padding-top: 0.5rem;
            border-top: 1px dashed var(--card-border);
        }

        /* Action Buttons */
        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            transform: scale(1.1);
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .btn-icon.edit:hover {
            background: var(--primary-glow);
            color: var(--primary);
        }

        /* Modal Custom Style */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 450px;
            box-shadow: var(--shadow);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-title {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .modal-input {
            width: 100%;
            padding: 0.8rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            margin-bottom: 1.2rem;
            font-size: 1rem;
            transition: var(--transition);
        }

        .modal-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .modal-btn.cancel {
            background: transparent;
            color: var(--text-muted);
        }

        .modal-btn.cancel:hover {
            color: var(--text-main);
        }

        .modal-btn.save {
            background: var(--primary);
            color: #fff;
        }

        .modal-btn.save:hover {
            background: var(--primary-hover);
        }

        /* ==========================================
           5. مصفوفة الأنيميشن (Keyframes)
           ========================================== */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .board {
                grid-template-columns: 1fr;
            }
            .column {
                min-height: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar Controls -->
    <div class="top-bar">
        <div class="controls-group">
            <button id="theme-toggle" class="theme-toggle-btn">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">الوضع الداكن</span>
            </button>
            <button id="palette-btn" class="palette-btn" title="تغيير ألوان الموقع">
                🎨 الألوان
            </button>
            <!-- Palette Selector Dropdown -->
            <div id="palette-menu" class="color-palette-menu">
                <div class="color-dot active" style="background: #8b5cf6;" data-theme-value="default" title="بنفسجي"></div>
                <div class="color-dot" style="background: #0284c7;" data-theme-value="ocean" title="أزرق"></div>
                <div class="color-dot" style="background: #10b981;" data-theme-value="emerald" title="أخضر"></div>
                <div class="color-dot" style="background: #f43f5e;" data-theme-value="rose" title="وردي"></div>
            </div>
        </div>

        <div class="stats-badge">
            المهام المتبقية: <span id="pending-count">0</span>
        </div>
    </div>

    <!-- Header Section -->
    <header>
        <h1 class="main-title" id="title">To Do List 📝</h1>
        <p class="author-subtitle">اضغط على العنوان لمعرفة المطور</p>
    </header>

    <!-- Action Bar -->
    <div class="actions-bar">
        <button id="open-modal-btn" class="create-btn">
            <span>+</span> إضافة مهمة جديدة
        </button>
    </div>

    <!-- Task Board Columns -->
    <div class="board">
        <!-- Column 1: Pending Tasks -->
        <div class="column">
            <div class="column-header">
                <h2 class="column-title">⏳ قيد الانتظار</h2>
            </div>
            <div class="task-list" id="tasks"></div>
        </div>

        <!-- Column 2: Completed Tasks -->
        <div class="column">
            <div class="column-header">
                <h2 class="column-title">✅ المكتملة</h2>
            </div>
            <div class="task-list" id="completed"></div>
        </div>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal" id="task-modal">
    <div class="modal-content">
        <h3 class="modal-title" id="modal-heading">إضافة مهمة جديدة</h3>
        <input type="text" id="modal-input" class="modal-input" placeholder="اكتب تفاصيل المهمة..." />
        <div class="modal-actions">
            <button class="modal-btn cancel" id="close-modal-btn">إلغاء</button>
            <button class="modal-btn save" id="save-task-btn">حفظ</button>
        </div>
    </div>
</div>

<script>
    // State Management
    let allTasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let editingTaskId = null;

    // DOM Elements
    const tasksContainer = document.getElementById("tasks");
    const completedContainer = document.getElementById("completed");
    const title = document.getElementById("title");
    const pendingCount = document.getElementById("pending-count");

    // Modal Elements
    const modal = document.getElementById("task-modal");
    const modalInput = document.getElementById("modal-input");
    const openModalBtn = document.getElementById("open-modal-btn");
    const closeModalBtn = document.getElementById("close-modal-btn");
    const saveTaskBtn = document.getElementById("save-task-btn");
    const modalHeading = document.getElementById("modal-heading");

    // Palette & Theme Elements
    const paletteBtn = document.getElementById("palette-btn");
    const paletteMenu = document.getElementById("palette-menu");
    const colorDots = document.querySelectorAll(".color-dot");

    // Title Toggle Author Name
    if (title) {
        title.addEventListener("click", () => {
            title.textContent = title.textContent === "by Hamza Mohamed" ? "To Do List 📝" : "by Hamza Mohamed";
        });
    }

    // Save tasks to LocalStorage and update counts
    function updateState() {
        localStorage.setItem('my_tasks', JSON.stringify(allTasks));
        const pending = allTasks.filter(t => !t.isCompleted).length;
        pendingCount.textContent = pending;
    }

    // Render Single Card
    function createCardElement(taskObj) {
        const card = document.createElement('div');
        card.className = `card ${taskObj.isCompleted ? 'completed' : ''}`;

        card.innerHTML = `
            <div class="card-body">
                <input type="checkbox" class="card-checkbox" ${taskObj.isCompleted ? 'checked' : ''}>
                <p class="card-text">${escapeHtml(taskObj.text)}</p>
            </div>
            <div class="card-footer">
                <button class="btn-icon edit" title="تعديل">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
                <button class="btn-icon delete" title="حذف">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        `;

        // Checkbox Event
        const checkbox = card.querySelector('.card-checkbox');
        checkbox.addEventListener('change', () => {
            taskObj.isCompleted = checkbox.checked;
            updateState();
            renderTasks();
        });

        // Delete Event
        const deleteBtn = card.querySelector('.btn-icon.delete');
        deleteBtn.addEventListener('click', () => {
            card.style.transform = 'scale(0.8)';
            card.style.opacity = '0';
            setTimeout(() => {
                allTasks = allTasks.filter(t => t.id !== taskObj.id);
                updateState();
                renderTasks();
            }, 200);
        });

        // Edit Event
        const editBtn = card.querySelector('.btn-icon.edit');
        editBtn.addEventListener('click', () => {
            editingTaskId = taskObj.id;
            modalInput.value = taskObj.text;
            modalHeading.textContent = "تعديل المهمة";
            openModal();
        });

        return card;
    }

    // Render All Tasks
    function renderTasks() {
        tasksContainer.innerHTML = '';
        completedContainer.innerHTML = '';

        allTasks.forEach(task => {
            const cardElement = createCardElement(task);
            if (task.isCompleted) {
                completedContainer.appendChild(cardElement);
            } else {
                tasksContainer.appendChild(cardElement);
            }
        });

        updateState();
    }

    // Modal Handlers
    function openModal() {
        modal.style.display = 'flex';
        modalInput.focus();
    }

    function closeModal() {
        modal.style.display = 'none';
        modalInput.value = '';
        editingTaskId = null;
        modalHeading.textContent = "إضافة مهمة جديدة";
    }

    openModalBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    saveTaskBtn.addEventListener('click', () => {
        const val = modalInput.value.trim();
        if (!val) return;

        if (editingTaskId) {
            const task = allTasks.find(t => t.id === editingTaskId);
            if (task) task.text = val;
        } else {
            allTasks.push({
                id: Date.now(),
                text: val,
                isCompleted: false
            });
        }

        updateState();
        renderTasks();
        closeModal();
    });

    // Enter Key on Modal
    modalInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveTaskBtn.click();
    });

    // Color Palette Toggle Menu
    paletteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        paletteMenu.classList.toggle("show");
    });

    document.addEventListener("click", () => {
        paletteMenu.classList.remove("show");
    });

    // Color Theme Switching
    colorDots.forEach(dot => {
        dot.addEventListener("click", () => {
            const themeValue = dot.getAttribute("data-theme-value");

            colorDots.forEach(d => d.classList.remove("active"));
            dot.classList.add("active");

            if (themeValue === "default") {
                document.documentElement.removeAttribute("data-theme");
            } else {
                document.documentElement.setAttribute("data-theme", themeValue);
            }

            localStorage.setItem("selected_theme", themeValue);
        });
    });

    // Load Saved Theme
    const savedTheme = localStorage.getItem("selected_theme");
    if (savedTheme && savedTheme !== "default") {
        document.documentElement.setAttribute("data-theme", savedTheme);
        colorDots.forEach(dot => {
            dot.classList.toggle("active", dot.getAttribute("data-theme-value") === savedTheme);
        });
    }

    // Dark/Light Theme Handler
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeText = document.getElementById("theme-text");

    themeToggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");
        const isLight = document.body.classList.contains("light-mode");
        themeIcon.textContent = isLight ? "☀️" : "🌙";
        themeText.textContent = isLight ? "الوضع الفاتح" : "الوضع الداكن";
    });

    // Utility: Prevent HTML Injection
    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
    }

    // Initialize Page
    renderTasks();
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do List | قائمة المهام الشاملة</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Top Controls Bar -->
    <div class="top-bar">
        <div class="controls-group">
            <button id="theme-toggle" class="theme-toggle-btn">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">الوضع الداكن</span>
            </button>
            <button id="palette-btn" class="palette-btn" title="تغيير الألوان">🎨 الألوان</button>

            <div id="palette-menu" class="color-palette-menu">
                <div class="color-dot active" style="background: #8b5cf6;" data-theme-value="default"></div>
                <div class="color-dot" style="background: #0284c7;" data-theme-value="ocean"></div>
                <div class="color-dot" style="background: #10b981;" data-theme-value="emerald"></div>
                <div class="color-dot" style="background: #f43f5e;" data-theme-value="rose"></div>
            </div>
        </div>

        <div class="stats-badge">
            المهام المتبقية: <span id="pending-count">0</span>
        </div>
    </div>

    <!-- Header Section -->
    <header>
        <h1 class="main-title" id="title">To Do List 📝</h1>
        <p class="author-subtitle">اضغط على العنوان لمعرفة المطور</p>
    </header>

    <div class="actions-bar">
        <button id="open-modal-btn" class="create-btn">
            <span>+</span> إضافة مهمة جديدة
        </button>
    </div>

    <!-- Tasks Board Columns -->
    <div class="board">
        <div class="column">
            <div class="column-header"><h2 class="column-title">⏳ قيد الانتظار</h2></div>
            <div class="task-list" id="tasks"></div>
        </div>

        <div class="column">
            <div class="column-header"><h2 class="column-title">✅ المكتملة</h2></div>
            <div class="task-list" id="completed"></div>
        </div>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal" id="task-modal">
    <div class="modal-content">
        <h3 class="modal-title" id="modal-heading">إضافة مهمة جديدة</h3>

        <div class="form-group">
            <label class="form-label">تفاصيل المهمة</label>
            <input type="text" id="modal-input" class="modal-input" placeholder="اكتب تفاصيل المهمة..." />
        </div>

        <div class="form-group">
            <label class="form-label">أولوية المهمة</label>
            <select id="modal-priority" class="modal-select">
                <option value="high">🔴 عالي - أولوية عاجلة</option>
                <option value="medium" selected>🟡 متوسط - أولوية عادية</option>
                <option value="low">🟢 منخفض - أولوية غير عاجلة</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">إرفاق ملفات متعددة (Excel, PHP, Images, PDF...)</label>
            <input type="file" id="modal-file" class="modal-input" multiple />
            <span style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">يمكنك اختيار أكثر من ملف دفعة واحدة.</span>
        </div>

        <div class="modal-actions">
            <button class="modal-btn cancel" id="close-modal-btn">إلغاء</button>
            <button class="modal-btn save" id="save-task-btn">حفظ المهمة</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Do List</title>
    <link rel="shortcut icon" href="a%20logo%20for%20todo%20list%20app.png" type="image/x-icon">
    <style>
        /* 1. إعدادات الصفحة العامة */
        body {
            background: #222;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* 2. العنوان الرئيسي وزرار Create */
        .title {
            text-align: center;
            background: dimgray;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto 15px auto;
            border-radius: 15px;
            cursor: pointer;
            user-select: none;
        }

        .create-wrapper {
            text-align: center;
            margin-bottom: 30px;
        }

        .create-btn {
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            color: #fff;
            background-color: #7d2ae8;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .create-btn:hover {
            background-color: #6c23cd;
            transform: scale(1.05);
        }

        /* 3. حاوية الأقسام الرئيسية */
        .listis {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 4. الأعمدة */
        .com {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .title2, .title3 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 5. أماكن نزول الكروت */
        .tasks, #completed {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .task-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 6. الخط الفاصل */
        .line {
            width: 3px;
            background: darkgrey;
            border-radius: 10px;
            align-self: stretch;
            min-height: 400px;
        }

        /* 7. تصميم الكارت */
        .card {
            width: 100%;
            max-width: 290px;
            min-height: 70px;
            background: #353535;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease-in-out;
            padding: 5px 0;
        }

        .card:hover {
            cursor: pointer;
            transform: scale(1.03);
        }

        .img {
            width: 50px;
            height: 50px;
            margin-left: 10px;
            border-radius: 10px;
            background: linear-gradient(#d7cfcf, #9198e5);
            transition: background 0.3s ease;
            flex-shrink: 0;
        }

        .card:hover > .img {
            background: linear-gradient(#9198e5, #712020);
        }

        .textBox {
            width: calc(100% - 80px);
            margin-left: 10px;
            margin-right: 10px;
            font-family: 'Poppins', sans-serif;
            word-break: break-word;
        }

        .textContent {
            display: flex;
            align-items: center;
        }

        .h1 {
            font-size: 15px;
            font-weight: bold;
            margin: 0;
            color: var(--text-color);
        }

        /* 8. مجموعة الأزرار والأنيميشن */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .del-btn, .edit-btn, .done-btn, .not_done-btn {
            position: relative;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .del-btn { background-color: #e74c3c; }      /* أحمر */
        .edit-btn { background-color: #7d2ae8; }     /* بنفسجي */
        .done-btn { background-color: #2ecc71; }     /* أخضر */
        .not_done-btn { background-color: #e67e22; } /* برتقالي */

        .del-btn:active, .edit-btn:active, .done-btn:active, .not_done-btn:active {
            transform: scale(0.96);
        }

        /* ==========================================
           متغيرات الألوان للمظهرين (Dark & Light)
           ========================================== */
        :root {
            --bg-color: #222;
            --text-color: #ffffff;
            --card-bg: #353535;
            --header-bg: dimgray;
            --line-color: darkgrey;
        }

        body.light-mode {
            --bg-color: #f4f5f9;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --header-bg: #7d2ae8;
            --line-color: #ccc;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.4s ease, color 0.4s ease;
        }

        .title {
            background: var(--header-bg);
            transition: background 0.4s ease;
        }

        .card {
            background: var(--card-bg);
        }

        .line {
            background: var(--line-color);
        }

        .glow-btn {
            --glow-color: rgb(217, 176, 255);
            --glow-spread-color: rgba(191, 123, 255, 0.781);
            --btn-color: rgb(100, 61, 136);
            border: .25em solid var(--glow-color);
            padding: 0.8em 2em;
            color: var(--glow-color);
            font-size: 14px;
            font-weight: bold;
            background-color: var(--btn-color);
            border-radius: 1em;
            outline: none;
            box-shadow: 0 0 1em .25em var(--glow-color),
            0 0 4em 1em var(--glow-spread-color),
            inset 0 0 .75em .25em var(--glow-color);
            text-shadow: 0 0 .5em var(--glow-color);
            position: relative;
            transition: all 0.3s;
            cursor: pointer;
        }

        body.light-mode .glow-btn {
            --glow-color: #7d2ae8;
            --glow-spread-color: rgba(125, 42, 232, 0.4);
            --btn-color: #f0e6ff;
            color: #7d2ae8;
            text-shadow: none;
        }

        @media (max-width: 768px) {
            .listis {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .line {
                width: 80%;
                height: 2px;
                min-height: auto;
                margin: 10px 0;
            }

            .card {
                max-width: 100%;
                width: 90vw;
            }

            .del-btn, .edit-btn, .done-btn, .not_done-btn {
                padding: 6px 10px;
                font-size: 11px;
            }

            .title {
                width: 90%;
                font-size: 20px;
                padding: 15px;
            }

            .glow-btn {
                padding: 0.6em 1.2em;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<button id="theme-toggle" class="glow-btn">
    <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
</button>
<div class="to_doo">
    <h1 class="title" id="title">To do list 📝 <p style="font-size: small">click me </p> </h1>
    <div class="create-wrapper">
        <button id="cre" class="create-btn">+ Create Task</button>
    </div>
</div>

<div class="listis">
    <!-- العمود الأول: Not Completed -->
    <div class="com">
        <h1 class="title2">not completed</h1>
        <div class="tasks" id="tasks"></div>
    </div>

    <!-- الخط الفاصل -->
    <div class="line"></div>

    <!-- العمود الثاني: Completed -->
    <div class="com">
        <h1 class="title3">Completed</h1>
        <div id="completed"></div>
    </div>
</div>

<script>
    const cre = document.getElementById("cre");
    const title = document.getElementById("title");
    const tasks = document.getElementById("tasks");
    const completedSection = document.getElementById("completed");

    // مصفوفة حفظ كافة المهام
    let allTasks = JSON.parse(localStorage.getItem('my_tasks')) || [];

    if (title) {
        title.addEventListener("click", function () {
            title.innerHTML = "by Hamza Mohamed";
        });
    }

    // دالة لحفظ حالة المصفوفة في LocalStorage
    function saveToLocalStorage() {
        localStorage.setItem('my_tasks', JSON.stringify(allTasks));
    }

    // دالة لبناء الكارت وحقنه في DOM
    function renderTaskCard(taskObj) {
        const codeDiv = document.createElement('div');
        codeDiv.classList.add('task-item');

        codeDiv.innerHTML = `
            <div class="card">
              <div class="img"></div>
              <div class="textBox">
                <div class="textContent">
                  <p class="h1 note_to_ed">${taskObj.text}</p>
                </div>
              </div>
            </div>
            <div class="btn-group">
              <button class="del-btn">delete</button>
              <button class="edit-btn">change note</button>
              <button class="done-btn">completed</button>
              <button class="not_done-btn">n't completed</button>
            </div>
        `;

        const delBtn = codeDiv.querySelector(".del-btn");
        const editBtn = codeDiv.querySelector(".edit-btn");
        const doneBtn = codeDiv.querySelector(".done-btn");
        const notDoneBtn = codeDiv.querySelector(".not_done-btn");
        const noteText = codeDiv.querySelector(".note_to_ed");

        // ضبط حالة الأزرار حسب اكتمال المهمة
        if (taskObj.isCompleted) {
            doneBtn.style.display = "none";
            notDoneBtn.style.display = "inline-block";
            completedSection.appendChild(codeDiv);
        } else {
            notDoneBtn.style.display = "none";
            doneBtn.style.display = "inline-block";
            tasks.appendChild(codeDiv);
        }

        // 1. زر الحذف
        delBtn.addEventListener("click", function () {
            codeDiv.remove();
            allTasks = allTasks.filter(t => t.id !== taskObj.id);
            saveToLocalStorage();
        });

        // 2. زر التعديل
        editBtn.addEventListener("click", function () {
            let newNote = prompt("اكتب الملاحظة الجديدة:", noteText.textContent);
            if (newNote && newNote.trim() !== "") {
                noteText.textContent = newNote.trim();
                taskObj.text = newNote.trim();
                saveToLocalStorage();
            }
        });

        // 3. زر نقل إلى Completed
        doneBtn.addEventListener("click", function () {
            completedSection.appendChild(codeDiv);
            doneBtn.style.display = "none";
            notDoneBtn.style.display = "inline-block";
            taskObj.isCompleted = true;
            saveToLocalStorage();
        });

        // 4. زر الإرجاع إلى Not Completed
        notDoneBtn.addEventListener("click", function () {
            tasks.appendChild(codeDiv);
            notDoneBtn.style.display = "none";
            doneBtn.style.display = "inline-block";
            taskObj.isCompleted = false;
            saveToLocalStorage();
        });
    }

    // تحميل وتوليد العناصر القديمة عند فتح الصفحة
    function loadSavedTasks() {
        allTasks.forEach(task => renderTaskCard(task));
    }

    // إضافة مهمة جديدة
    cre.addEventListener("click", function () {
        let taskText = prompt("اكتب الملاحظة الجديدة:");
        if (!taskText || taskText.trim() === "") return;

        const newTask = {
            id: Date.now(), // معرف فريد للمهمة
            text: taskText.trim(),
            isCompleted: false
        };

        allTasks.push(newTask);
        saveToLocalStorage();
        renderTaskCard(newTask);
    });

    // Dark / Light Mode Toggle
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const themeText = document.getElementById("theme-text");

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener("click", function () {
            document.body.classList.toggle("light-mode");

            if (document.body.classList.contains("light-mode")) {
                themeIcon.textContent = "☀️";
                themeText.textContent = "Light Mode";
            } else {
                themeIcon.textContent = "🌙";
                themeText.textContent = "Dark Mode";
            }
        });
    }

    // تشغيل استرجاع المهام فور تحميل الصفحة
    loadSavedTasks();
</script>
</body>
</html>
